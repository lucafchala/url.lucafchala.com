name: checks
on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          set -e
          find . -name '*.json' -not -path '*/node_modules/*' -not -path './.git/*' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Forbid weak HTML escapers (must also escape quotes)
        run: |
          if grep -rnE --include='*.html' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git "replace\(/>/g, ?'&gt;'\) *[;)]" .; then
            echo "Found a 3-char HTML escaper - use the canonical 5-char version that also escapes quotes"
            exit 1
          fi

      - name: Security headers file present
        run: test -f _headers

      - name: JS syntax
        run: for f in *.js; do node --check "$f" || exit 1; done

      - name: No inline scripts or handlers (CSP is script-src 'self')
        run: |
          python3 - <<'PY'
          import re, glob, sys
          bad = []
          for p in glob.glob('*.html'):
              html = open(p, encoding='utf-8').read()
              for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>', html, re.S):
                  if 'src=' not in m.group(1) and m.group(2).strip(): bad.append(f'{p}: inline <script>')
              bad += [f'{p}: inline handler {h}' for h in re.findall(r'\s(on[a-z]+)=', html)]
          if bad: print('\n'.join(bad)); sys.exit(1)
          print('No inline scripts or handlers.')
          PY

      - name: Generated files agree with each other
        run: |
          python3 - <<'PY'
          import json, re, sys
          errs = []
          for f in ('index.html', 'url.js', '404.html', '404.js', '_redirects'):
              if 'generated by dash.lucafchala.com' not in open(f, encoding='utf-8').read():
                  errs.append(f'{f} lacks the "generated by dash.lucafchala.com" marker — was it edited by hand?')
          items = json.load(open('data.json', encoding='utf-8'))['redirects']
          rules = {}
          for line in open('_redirects', encoding='utf-8'):
              line = line.strip()
              if line and not line.startswith('#'):
                  src, dest, code = line.split()
                  rules[src] = (dest, int(code))
          index = open('index.html', encoding='utf-8').read()
          for r in items:
              want = (r['destination'], 301 if r.get('status') == 301 else 302)
              if rules.get('/' + r['slug']) != want: errs.append(f"_redirects: /{r['slug']} is {rules.get('/' + r['slug'])}, data.json says {want}")
              if f'>/{r["slug"]}</a>' not in index.replace('&amp;', '&'): errs.append(f"index.html does not list /{r['slug']}")
          extra = set(rules) - {'/' + r['slug'] for r in items}
          errs += [f'_redirects has {s} but data.json does not' for s in sorted(extra)]
          if errs: print('\n'.join(errs)); print('Regenerate from the dash (save or "sync").'); sys.exit(1)
          print(f'{len(items)} links consistent across data.json, _redirects and index.html.')
          PY

  drift:
    # lucafchala.com and url.lucafchala.com must serve the same short links.
    # Only on the weekly schedule: while PRs for both repos are open, the other
    # repo's main is legitimately behind.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: _redirects matches lucafchala.com
        run: |
          curl -fsSL https://raw.githubusercontent.com/lucafchala/lucafchala.com/main/_redirects -o apex_redirects
          diff -u apex_redirects _redirects && echo "In sync with lucafchala.com."
